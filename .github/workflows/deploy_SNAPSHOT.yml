name: Deploy dev-SNAPSHOT

on:
  push:
    branches: [ dev ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Set up JDK 25
      uses: actions/setup-java@v6.1.0
      with:
        distribution: 'temurin'
        java-version: 25
        server-id: central
        server-username-env-var: MAVEN_USERNAME
        server-password-env-var: MAVEN_PASSWORD

    - name: Cache maven deps
      uses: actions/cache@v6
      with:
        path: ~/.m2/repository
        key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
        restore-keys: |
          ${{ runner.os }}-maven-

    - name: Build and test with Maven using xvfb
      uses: GabrielBB/xvfb-action@v1
      with:
        run: |
          mvn test -B -Dmaven.javadoc.skip=true -Djacoco.skip=true -Dpmd.skip=true

    - name: Deploy SNAPSHOT build
      run: mvn deploy -DskipTests=true -Dlicense.skip=true -Dpmd.skip=true
      env:
        MAVEN_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
        MAVEN_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
        MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        MAVEN_GPG_KEY: ${{ secrets.MAVEN_GPG_KEY }}
